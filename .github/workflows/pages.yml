name: Publicar en GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Obtener el código
        uses: actions/checkout@v4

      - name: Configurar Pages
        uses: actions/configure-pages@v5

      - name: Armar el sitio
        run: |
          mkdir -p _site/js
          cp index.html _site/
          cp -r css assets _site/
          touch _site/.nojekyll
          npx --yes esbuild@0.25.10 js/game.js \
            --bundle \
            --minify \
            --format=esm \
            --target=es2022 \
            --outfile=_site/js/game.js

      - name: Subir el sitio
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
